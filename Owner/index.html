<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBSystem Owner</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202b;--mute:#5d6b7a;--line:#d9e0e6;--acc:#0b6b5c;--acc-ink:#fff;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181e;--card:#1b242c;--ink:#e8edf1;--mute:#9aa8b5;--line:#2b3742;--acc:#35b9a3;--acc-ink:#07201b;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input[type=checkbox]{width:auto}
button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar>div{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.site{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--card)}
.site b{display:block;font-size:1.05rem}
.num{font-size:1.7rem;font-weight:700;margin:8px 0 2px}
.mute{color:var(--mute);font-size:.9rem}
.tot{font-size:2rem;font-weight:700}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:.9rem;color:var(--mute);margin-bottom:4px}
.msg{margin-top:10px;min-height:1.3em}.err{color:var(--bad)}
.off{opacity:.6}
.login{max-width:380px;margin:12vh auto 0}.login .box>*+*{margin-top:12px}
</style>
</head>
<body>
<main>
<section id="login" class="login" hidden>
  <h1>Owner sign in</h1>
  <div class="box">
    <div><label for="g">Group id</label><input id="g" autocomplete="username" autocapitalize="none"></div>
    <div><label for="k">Owner key</label><input id="k" type="password" autocomplete="current-password"></div>
    <button class="p" id="go" style="width:100%">Sign in</button>
    <div class="msg err" id="lerr" role="alert"></div>
  </div>
</section>

<section id="app" hidden>
  <div class="bar">
    <h1 id="title">Your venues</h1>
    <div><select id="range" aria-label="Period"><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button id="out">Sign out</button></div>
  </div>
  <div class="box"><span class="mute">All venues</span><div class="tot" id="tot">-</div><div class="mute" id="totsub"></div></div>
  <div class="box"><h2>Sales by venue</h2><div class="grid" id="sites"></div><div class="msg err" id="rerr" role="alert"></div></div>

  <section class="box" id="edit" hidden>
    <h2 id="etitle">Settings</h2>
    <div class="f">
      <div><label for="venueName">Venue name</label><input id="venueName"></div>
      <div><label for="venueAddr">Address</label><input id="venueAddr"></div>
      <div><label for="venueTel">Phone</label><input id="venueTel"></div>
      <div><label for="currency">Currency symbol</label><input id="currency" maxlength="4"></div>
      <div><label for="tableCount">Tables</label><input id="tableCount" type="number" min="1" max="200"></div>
      <div><label for="barSeats">Bar seats</label><input id="barSeats" type="number" min="0" max="100"></div>
      <div><label for="vatRate">VAT %</label><input id="vatRate" type="number" min="0" max="30" step="0.1"></div>
      <div><label for="serviceChargeRate">Service charge %</label><input id="serviceChargeRate" type="number" min="0" max="30" step="0.5"></div>
      <div><label for="receiptFooter">Receipt footer</label><input id="receiptFooter"></div>
      <div><label for="serviceCharge">Service charge</label><label style="color:inherit"><input id="serviceCharge" type="checkbox"> Add to bills</label></div>
    </div>
    <div class="bar" style="margin-top:14px"><div><button class="p" id="save">Save changes</button><button id="close">Close</button></div></div>
    <div class="msg" id="emsg" role="status"></div>
    <p class="mute">Tills and tablets pick up saved changes on their next sync.</p>
  </section>
</main>

<script>
// 1) Put your project URL here:
const API = 'https://wpfqxxnqksbkyzmcipft.supabase.co/functions/v1/cbs-biz';

const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, c) => (c || '£') + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let S = null, cur = null;
try { S = JSON.parse(sessionStorage.getItem('cbs_owner') || 'null'); } catch (e) {}

async function call(action, extra) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, org: S.org, key: S.key, ...extra }) });
  const j = await r.json().catch(() => ({ error: 'Bad response from server' }));
  if (!r.ok || j.error) throw new Error(j.error || 'Request failed');
  return j;
}
function period() {
  const v = $('range').value, d = new Date(); d.setHours(0, 0, 0, 0);
  if (v !== 'today') d.setDate(d.getDate() - (Number(v) - 1));
  return { from: d.getTime(), to: Date.now() };
}
async function load() {
  $('rerr').textContent = '';
  try {
    const j = await call('org_report', period());
    $('title').textContent = j.org;
    const cur0 = j.sites[0]?.currency || '£';
    const rev = j.sites.reduce((a, s) => a + s.revenue, 0), ord = j.sites.reduce((a, s) => a + s.orders, 0);
    $('tot').textContent = money(rev, cur0);
    $('totsub').textContent = ord + ' orders across ' + j.sites.length + ' venue' + (j.sites.length === 1 ? '' : 's');
    $('sites').innerHTML = j.sites.length ? j.sites.map((s) => `
      <div class="site ${s.active ? '' : 'off'}">
        <b>${esc(s.name)}</b><div class="num">${money(s.revenue, s.currency)}</div>
        <div class="mute">${s.orders} orders${s.orders ? ' · avg ' + money(s.revenue / s.orders, s.currency) : ''}${s.active ? '' : ' · suspended'}</div>
        <button style="margin-top:12px" data-site="${esc(s.id)}">Edit settings</button>
      </div>`).join('') : '<p class="mute">No venues are linked to this group yet. Ask CBSystem to add them.</p>';
  } catch (e) { fail(e); }
}
function fail(e) {
  if (/Invalid group|suspended/.test(e.message)) { signOut(); $('lerr').textContent = e.message === 'suspended' ? 'This group is suspended.' : 'Wrong group id or key.'; }
  else $('rerr').textContent = e.message;
}
async function openSite(id) {
  $('emsg').textContent = ''; $('emsg').className = 'msg';
  try {
    const j = await call('org_getSite', { site: id });
    cur = id; $('etitle').textContent = 'Settings: ' + j.cfg.venueName;
    for (const k of ['venueName', 'venueAddr', 'venueTel', 'currency', 'tableCount', 'barSeats', 'vatRate', 'serviceChargeRate', 'receiptFooter']) $(k).value = j.cfg[k];
    $('serviceCharge').checked = !!j.cfg.serviceCharge;
    $('edit').hidden = false; $('edit').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { $('rerr').textContent = e.message; }
}
async function save() {
  const cfg = {};
  for (const k of ['venueName', 'venueAddr', 'venueTel', 'currency', 'receiptFooter']) cfg[k] = $(k).value;
  for (const k of ['tableCount', 'barSeats', 'vatRate', 'serviceChargeRate']) cfg[k] = Number($(k).value);
  cfg.serviceCharge = $('serviceCharge').checked;
  try { await call('org_saveCfg', { site: cur, cfg }); $('emsg').textContent = 'Saved'; $('emsg').className = 'msg'; load(); }
  catch (e) { $('emsg').textContent = e.message; $('emsg').className = 'msg err'; }
}
function show() { $('login').hidden = !!S; $('app').hidden = !S; if (S) load(); }
function signOut() { S = null; sessionStorage.removeItem('cbs_owner'); $('edit').hidden = true; show(); }

$('go').onclick = async () => {
  $('lerr').textContent = '';
  S = { org: $('g').value.trim().toLowerCase(), key: $('k').value.trim() };
  try { await call('org_report', period()); sessionStorage.setItem('cbs_owner', JSON.stringify(S)); $('k').value = ''; show(); }
  catch (e) { S = null; $('lerr').textContent = e.message; }
};
$('k').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = signOut;
$('range').onchange = load;
$('save').onclick = save;
$('close').onclick = () => { $('edit').hidden = true; };
$('sites').onclick = (e) => { const b = e.target.closest('[data-site]'); if (b) openSite(b.dataset.site); };
show();
</script>
</body>
</html>
